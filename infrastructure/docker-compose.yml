services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: pm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm"]
      interval: 5s
      retries: 10
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pm:pm@db:5432/pm
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-whsec_change_me}
      DEBUG: ${DEBUG:-true}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
volumes:
  pgdata:
  uploads:
